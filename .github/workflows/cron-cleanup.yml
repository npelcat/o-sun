name: Automatic RGPD Data Deletion

# Trigger: 1st of every month at 2am UTC
on:
  schedule:
    - cron: "0 2 1 * *"
  # Also allows manual triggering from the GitHub UI, to test without
  # waiting for the next scheduled run
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call the cleanup route
        run: |
          curl --fail -L \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/cleanup"

# --fail makes curl exit non-zero on an HTTP error, which fails the job
# and triggers a GitHub Actions email notification.
